name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-depot
        uses: .
        with:
          version: "0.0.2"
      - name: Assert depot CLI is installed and executable
        run: |
          echo "Checking depot CLI is on PATH..."
          if ! command -v depot &>/dev/null; then
            echo "FAIL: depot CLI not found on PATH"
            exit 1
          fi
          echo "PASS: depot found at $(command -v depot)"
      - name: Assert depot CLI reports the expected version
        run: |
          VERSION_OUTPUT=$(depot version 2>&1 || true)
          echo "depot version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: depot version produced no output"
            exit 1
          fi
          if echo "$VERSION_OUTPUT" | grep -q "0.0.2"; then
            echo "PASS: version 0.0.2 confirmed"
          else
            echo "FAIL: expected version 0.0.2 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
