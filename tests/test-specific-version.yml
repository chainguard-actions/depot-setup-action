name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: "2.68.0"
      - name: Assert depot CLI is installed
        run: |
          echo "Checking depot CLI is available on PATH..."
          if ! command -v depot >/dev/null 2>&1; then
            echo "FAIL: depot CLI not found on PATH"
            exit 1
          fi
          echo "PASS: depot CLI found at $(command -v depot)"
      - name: Assert depot CLI is the correct version
        run: |
          echo "Checking depot CLI version..."
          VERSION_OUTPUT=$(depot version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.68.0"; then
            echo "PASS: correct version 2.68.0 installed"
          else
            echo "FAIL: expected version 2.68.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
