name: Test basic usage - install latest Depot CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: latest
      - name: Assert depot CLI is installed
        run: |
          echo "Checking depot CLI is available on PATH..."
          if ! command -v depot >/dev/null 2>&1; then
            echo "FAIL: depot CLI not found on PATH"
            exit 1
          fi
          echo "PASS: depot CLI found at $(command -v depot)"
      - name: Assert depot CLI runs
        run: |
          echo "Checking depot CLI version output..."
          VERSION_OUTPUT=$(depot version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: depot version produced no output"
            exit 1
          fi
          echo "PASS: depot version output: $VERSION_OUTPUT"
